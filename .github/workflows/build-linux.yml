name: Build Linux AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-shape0 libxkbcommon-x11-0 \
            libgl1-mesa-glx libglib2.0-0 \
            qt6-base-dev libqt6webenginecore6 libqt6webenginewidgets6 \
            xvfb
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile
          --name MCS_CVOR
          --hidden-import PyQt6.QtWebEngineWidgets
          --hidden-import PyQt6.QtWebEngineCore
          --hidden-import sqlalchemy.dialects.sqlite
          mcs_cvor/main.py
      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/MCS_CVOR AppDir/usr/bin/
          cat > AppDir/MCS_CVOR.desktop <<EOF
          [Desktop Entry]
          Name=MCS CVOR
          Exec=MCS_CVOR
          Icon=MCS_CVOR
          Type=Application
          Categories=Utility;
          EOF
          touch AppDir/MCS_CVOR.png
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
      - name: Build AppImage
        run: ARCH=x86_64 ./appimagetool AppDir MCS_CVOR-x86_64.AppImage
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCS_CVOR-Linux
          path: MCS_CVOR-x86_64.AppImage
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MCS_CVOR-x86_64.AppImage
